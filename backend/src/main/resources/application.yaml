spring:
  application:
    name: mediacleaner

  # 🐳 MySQLへの接続設定
  datasource:
    url: jdbc:mysql://localhost:3306/mydatabase
    username: root
    password: root # ※もしパスワードを別名に変えていたらそこだけ書き換えてください

  # ⚡ データベースを自動で組み立てる魔法の設定
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # 実行されたSQLを黒い画面（ログ）に見せる設定
