spring:
  application:
    name: mediacleaner

  # 🐳 MySQLへの接続設定
  datasource:
    url: jdbc:mysql://localhost:3306/mediacleaner
    username: root
    password: mediacleaner # ※もしパスワードを別名に変えていたらそこだけ書き換えてください

  # ⚡ データベースを自動で組み立てる魔法の設定
  jpa:
    hibernate:
      ddl-auto: create # 一時的に「create」に変えます
    show-sql: true # 実行されたSQLを黒い画面（ログ）に見せる設定
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
